services:
  plex-autoplay:
    image: ghcr.io/digodps/plex-autoplay:latest
    container_name: plex-autoplay
    network_mode: bridge
    restart: unless-stopped
    ports:
      - protocol: tcp
        published: "8080"
        target: 8080
    environment:
      PLEX_URL: "${PLEX_URL:-http://192.168.1.100:32400}"
      PLEX_TOKEN: "${PLEX_TOKEN:-COLOQUE_SEU_TOKEN_PLEX}"
      AUTO_SKIP_INTRO: "true"
      AUTO_NEXT_EPISODE: "false"
      NEXT_EPISODE_THRESHOLD_SECONDS: "15"
      POLL_INTERVAL_SECONDS: "2"
      DEFAULT_INTRO_SKIP_SECONDS: "0"
      WEB_PORT: "8080"
      DASHBOARD_COOKIE_SECURE: "${DASHBOARD_COOKIE_SECURE:-false}"
      DASHBOARD_HTTPS: "${DASHBOARD_HTTPS:-false}"
      DASHBOARD_TLS_HOSTS: "${DASHBOARD_TLS_HOSTS:-localhost,plex-autoplay,host.docker.internal}"
      LOG_LEVEL: INFO
    volumes:
      - type: bind
        source: /DATA/AppData/plex-autoplay
        target: /config

x-casaos:
  author: self
  category: self
  hostname: ""
  index: /
  is_uncontrolled: false
  main: plex-autoplay
  scheme: https
  title:
    custom: Plex Autoplay
    en_us: Plex Autoplay
    pt_br: Plex Autoplay
  port_map: "8080"