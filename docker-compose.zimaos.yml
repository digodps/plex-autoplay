services:
  plex-autoplay:
    build:
      context: https://github.com/digodps/plex-autoplay.git#main
    image: plex-autoplay:latest
    pull_policy: build
    container_name: plex-autoplay
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PLEX_URL: "${PLEX_URL:-http://host.docker.internal:32400}"
      PLEX_TOKEN: "${PLEX_TOKEN:?Defina PLEX_TOKEN no ambiente do Docker Compose}"
      AUTO_SKIP_INTRO: "true"
      AUTO_NEXT_EPISODE: "false"
      NEXT_EPISODE_THRESHOLD_SECONDS: "15"
      POLL_INTERVAL_SECONDS: "2"
      CUSTOM_MARKERS_FILE: /config/markers.json
      DEFAULT_INTRO_SKIP_SECONDS: "0"
      AUTO_GENERATE_ANIME_MARKERS: "${AUTO_GENERATE_ANIME_MARKERS:-true}"
      MEDIA_ROOT: /media-root
      WEB_PORT: "8080"
      ANIME_MARKERS_CACHE_FILE: /config/metadata-cache.json
      ANIME_MARKERS_CACHE_TTL_HOURS: "168"
      LOG_LEVEL: INFO
    volumes:
      - /DATA/AppData/plex-autoplay:/config
      - "${MEDIA_ROOT_HOST}:/media-root:ro"
x-casaos:
  hostname: ""
  index: /
  main: plex-autoplay
  scheme: http
  title:
    custom: Plex Autoplay
  port_map: "${WEB_HOST_PORT:-8080}"
