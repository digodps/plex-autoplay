<!-- Page CSS: only visual-internal and --p-h per card group -->
<style>
:root {
  --p-bg: #0a0d14; --p-surface: #131824; --p-ink: #e9edf3; --p-muted: #8891a1;
  --p-accent: #5ab9fc; --p-accent-ink: #0a0d14; --p-action: #5ab9fc; --p-action-ink: #0a0d14;
  --p-inv-bg: #e9edf3; --p-inv-surface: #d7dbe1; --p-inv-ink: #0a0d14; --p-inv-muted: #54575f;
  --p-inv-accent: #0a0d14; --p-inv-accent-ink: #e9edf3; --p-inv-action: #0a0d14; --p-inv-action-ink: #e9edf3;
  --font-display: "Instrument Sans", system-ui, sans-serif;
  --font-text: "Instrument Sans", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --display-weight: 500;
  --display-tracking: -0.028em;
  --display-tracking-xl: -0.036em;
  --display-stretch: 96%;
  --ly-scale: 1.04;
}
  .metrics-grid .panel { --p-h: 280px; }
  .library-grid .panel { --p-h: 220px; }
  .series-grid .panel { --p-h: 320px; }
  @media (max-width: 639px) {
    .metrics-grid .panel { --p-h: 180px; }
    .library-grid .panel { --p-h: 160px; }
    .series-grid .panel { --p-h: 200px; }
  }
</style>

<!-- Anti-FOUC: aplica o tema antes do primeiro paint (script bloqueante).
     system.js will also set data-tone; this is a bridge until system.js loads. -->
<script>
  (function () {
    try {
      var mode = localStorage.getItem("theme.mode") || "system";
      var dark =
        mode === "dark" ||
        (mode === "system" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.classList.toggle("dark", dark);
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  })();
</script>
