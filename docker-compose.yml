services:
  plex-autoplay:
    build: .
    container_name: plex-autoplay
    restart: unless-stopped
    ports:
      - "8443:443"     # HTTPS API + Vue SPA (mapeada para 8443 no host em modo rootless)
      - "8081:8081"   # WSS PlexAutoSkip WebSocket
    volumes:
      - plex-data:/data              # SQLite, image-cache, app-config.json
      - ${MEDIA_ROOT}:/media:ro     # Plex media files (read-only)
    environment:
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - MEDIA_ROOT=/media
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ASPNETCORE_URLS=https://+:443
      - OTEL_EXPORTER=${OTEL_EXPORTER:-console}
      - OTEL_ENDPOINT=${OTEL_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-plex-autoplay}
      - CERT_PATH=${CERT_PATH}
      - CERT_PASSWORD=${CERT_PASSWORD}
      - CERT_BASE64=${CERT_BASE64}
      - HTTPS_PORT=${HTTPS_PORT:-443}
      - DISABLE_HTTP=${DISABLE_HTTP:-true}
      - LOG_LEVEL=${LOG_LEVEL:-Information}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-5}
    depends_on: []
    networks:
      - plex-network

volumes:
  plex-data:

networks:
  plex-network:
    driver: bridge
