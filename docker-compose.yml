services:
  plex-autoplay:
    build:
      context: .
      args:
        PLEX_TOKEN: "${PLEX_TOKEN:-}"
        PLEX_URL: "${PLEX_URL:-http://host.docker.internal:32400}"
    container_name: plex-autoplay
    restart: unless-stopped
    security_opt:
      - "label=disable"
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      PLEX_URL: "${PLEX_URL:-http://host.docker.internal:32400}"
      PLEX_TOKEN: "${PLEX_TOKEN:-}"
      WEB_PORT: "8080"
      DASHBOARD_COOKIE_SECURE: "${DASHBOARD_COOKIE_SECURE:-false}"
      DASHBOARD_HTTPS: "${DASHBOARD_HTTPS:-false}"
      DASHBOARD_TLS_HOSTS: "${DASHBOARD_TLS_HOSTS:-localhost,plex-autoplay,host.docker.internal}"
      REDIS_URL: "${REDIS_URL:-redis://127.0.0.1:6379/0}"
    volumes:
      - plex-autoplay-config:/config
      - "${MEDIA_ROOT_HOST:-./media}:/Media:z"

volumes:
  plex-autoplay-config: