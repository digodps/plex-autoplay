services:
  plex-autoplay:
    build: .
    image: plex-autoplay:latest
    container_name: plex-autoplay
    restart: unless-stopped
    env_file: .env
    environment:
      WEB_PORT: "8081"
      DISABLE_HTTP: "false"
      MEDIA_ROOT: /home/hermes/media
      SQLITE_CONNECTION_STRING: "Data Source=/data/app.db"
      APP_CONFIG_PATH: /data/app-config.json
      LOG_LEVEL: Information
    ports:
      - "8080:8081"
    volumes:
      - ./data:/data
      - /home/hermes/media:/home/hermes/media:ro
