services:
  plex-autoplay:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    image: plex-autoplay:latest
    container_name: plex-autoplay
    restart: unless-stopped
    env_file: .env
    environment:
      WEB_PORT: "8081"
      DISABLE_HTTP: "false"
      MEDIA_ROOTS: ${MEDIA_ROOTS:-/home/hermes/media}
      SQLITE_CONNECTION_STRING: "Data Source=/data/app.db"
      APP_CONFIG_PATH: /data/app-config.json
      LOG_LEVEL: Information
    ports:
      - "8080:8081"
    volumes:
      - ./data:/data
      - /home/hermes/media:/home/hermes/media:ro
      # Monte aqui cada diretório adicional listado em MEDIA_ROOTS.
