services:
  plex-autoplay:
    build: .
    container_name: plex-autoplay
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      PLEX_URL: "${PLEX_URL:-http://host.docker.internal:32400}"
      CUSTOM_MARKERS_FILE: /config/markers.json
      AUTO_GENERATE_ANIME_MARKERS: "${AUTO_GENERATE_ANIME_MARKERS:-true}"
      MEDIA_ROOT: /media-root
      WEB_PORT: "8080"
      DASHBOARD_COOKIE_SECURE: "${DASHBOARD_COOKIE_SECURE:-true}"
      DASHBOARD_HTTPS: "${DASHBOARD_HTTPS:-true}"
      DASHBOARD_TLS_HOSTS: "${DASHBOARD_TLS_HOSTS:-localhost,plex-autoplay,host.docker.internal}"
      ANIME_MARKERS_CACHE_FILE: /config/metadata-cache.json
    volumes:
      - ./config:/config
      - "${MEDIA_ROOT_HOST:?Defina MEDIA_ROOT_HOST no arquivo .env}:/media-root:ro"
