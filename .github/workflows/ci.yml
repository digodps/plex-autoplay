name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------
  # 1️⃣  Build da solution .NET
  # --------------------------------------------------------------
  build:
    name: Build (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build solution
        run: dotnet build PlexAutoplay.slnx -c Release

  # --------------------------------------------------------------
  # 2️⃣  Testes e2e em container (app + executor + plex-mock)
  # --------------------------------------------------------------
  e2e:
    name: E2E (container)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_HOST: plex-autoplay-test
      PLEX_URL: http://plex-mock:32400
      PLEX_TOKEN: mock-token
      JWT_SECRET: ci-e2e-jwt-secret-0123456789abcdef0123456789abcdef
      ADMIN_PASSWORD: ci-e2e-admin-password
      MEDIA_ROOT: /tmp/plex-media
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for the test stack
        run: |
          cat > .env <<EOF
          PLEX_URL=http://plex-mock:32400
          PLEX_TOKEN=mock-token
          JWT_SECRET=ci-e2e-jwt-secret-0123456789abcdef0123456789abcdef
          ADMIN_PASSWORD=ci-e2e-admin-password
          MEDIA_ROOT=/tmp/plex-media
          EOF

      - name: Create media root directory
        run: mkdir -p /tmp/plex-media

      - name: Run e2e stack (app + executor + plex-mock)
        run: >-
          docker compose -f docker-compose.test.yml up
          --build --abort-on-container-exit --exit-code-from executor

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: test-artifacts/
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
