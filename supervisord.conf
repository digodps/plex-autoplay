# --------------------------------------------------------------
# supervisord.conf – runs redis, the Flask app and PlexAutoSkip
# --------------------------------------------------------------
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --dir /tmp --appendonly no
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=appuser

[program:plex-autoplay]
command=python -m plex_autoplay
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=root
environment=REDIS_URL="redis://127.0.0.1:6379/0",ADMIN_USER="%(ENV_ADMIN_USER)s",ADMIN_PASS="%(ENV_ADMIN_PASS)s"

# --------------------------------------------------------------
# PlexAutoSkip – reads /config/plexautoskip/custom.json and serves
# the /api/v1/skip endpoint on port 8081 (internal only)
# --------------------------------------------------------------
[program:plex-autoskip]
command=/app/start_autoskip.sh
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=root
environment=PLEX_URL="%(ENV_PLEX_URL)s",PLEX_TOKEN="%(ENV_PLEX_TOKEN)s"