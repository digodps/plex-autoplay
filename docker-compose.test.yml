services:
  executor:
    build:
      context: .
      dockerfile: Dockerfile.test-executor
    container_name: plex-autoplay-executor
    user: root
    volumes:
      - .:/workspace
      - ./test-artifacts:/workspace/test-artifacts
    security_opt:
      - label=disable
    environment:
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SETUP_TOKEN=${SETUP_TOKEN}
      - MEDIA_ROOT=${MEDIA_ROOT}
      - MEDIA_ROOTS=${MEDIA_ROOTS:-/media}
      - APP_HOST=${APP_HOST:-plex-autoplay.dns.podman}
      - PLAYWRIGHT_BASE_URL=${PLAYWRIGHT_BASE_URL:-http://${APP_HOST:-plex-autoplay.dns.podman}:80}
      - OPERATOR_PASSWORD=${OPERATOR_PASSWORD}
      - INSIDE_EXECUTOR_CONTAINER=true
    working_dir: /workspace
    depends_on:
      plex-autoplay:
        condition: service_started
      plex-mock:
        condition: service_started
    networks:
      - plex-test-network

  plex-mock:
    image: node:20-slim
    container_name: plex-mock
    restart: "no"
    working_dir: /app
    command: ["node", "server.cjs"]
    volumes:
      - ./tests/e2e/mock-plex:/app:ro
    expose:
      - "32400"
    security_opt:
      - label=disable
    networks:
      - plex-test-network

  plex-autoplay:
    build: .
    container_name: plex-autoplay-test
    restart: "no"
    depends_on:
      plex-mock:
        condition: service_started
    ports:
      - "8443:80"
    volumes:
      - plex-test-data:/data
      - ${MEDIA_ROOT}:/media:ro
    environment:
      - PLEX_URL=http://plex-mock:32400
      - PLEX_TOKEN=${PLEX_TOKEN}
      - MEDIA_ROOTS=/media
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SETUP_TOKEN=${SETUP_TOKEN}
      - WEB_PORT=80
      - ASPNETCORE_URLS=http://0.0.0.0:80
      - DISABLE_HTTP=false
      - OTEL_EXPORTER=${OTEL_EXPORTER:-console}
      - OTEL_ENDPOINT=${OTEL_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-plex-autoplay}
      - CERT_PATH=${CERT_PATH}
      - CERT_PASSWORD=${CERT_PASSWORD}
      - CERT_BASE64=${CERT_BASE64}
      - HTTPS_PORT=${HTTPS_PORT:-443}
    networks:
      - plex-test-network

volumes:
  plex-test-data:

networks:
  plex-test-network:
    driver: bridge
