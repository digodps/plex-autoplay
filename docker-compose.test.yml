services:
  executor:
    build:
      context: .
      dockerfile: Dockerfile.test-executor
    container_name: plex-autoplay-executor
    user: root
    volumes:
      - .:/workspace
      - ./test-artifacts:/workspace/test-artifacts
    security_opt:
      - label=disable
    environment:
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MEDIA_ROOT=${MEDIA_ROOT}
      - PLAYWRIGHT_BASE_URL=https://plex-autoplay.dns.podman:443
      - INSIDE_EXECUTOR_CONTAINER=true
    working_dir: /workspace
    depends_on:
      plex-autoplay:
        condition: service_started
    networks:
      - plex-test-network

  plex-autoplay:
    build: .
    container_name: plex-autoplay-test
    restart: "no"
    ports:
      - "8443:80"
    volumes:
      - plex-test-data:/data
      - ${MEDIA_ROOT}:/media:ro
    environment:
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - MEDIA_ROOT=/media
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ASPNETCORE_URLS=http://0.0.0.0:80
      - DISABLE_HTTP=false
      - OTEL_EXPORTER=${OTEL_EXPORTER:-console}
      - OTEL_ENDPOINT=${OTEL_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-plex-autoplay}
      - CERT_PATH=${CERT_PATH}
      - CERT_PASSWORD=${CERT_PASSWORD}
      - CERT_BASE64=${CERT_BASE64}
      - HTTPS_PORT=${HTTPS_PORT:-443}
    networks:
      - plex-test-network

volumes:
  plex-test-data:

networks:
  plex-test-network:
    driver: bridge
