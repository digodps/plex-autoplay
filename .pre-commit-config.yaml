repos:
  - repo: https://github.com/dotnet/format
    rev: 8.0.304
    hooks:
      - id: dotnet-format
        name: dotnet-format
        args: [--verify-no-changes]
        types_or: [csharp, csproj, props, targets]
        stages: [commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        name: GitHub Actions workflow lint
        files: \.github/workflows/.*\.(yml|yaml)$

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.15.0
    hooks:
      - id: eslint
        name: ESLint
        types_or: [javascript, vue]
        args: [--fix, --ext=.js,.vue]
        additional_dependencies:
          - eslint@9.15.0
          - eslint-plugin-vue@9.30.0
          - @eslint/js@9.15.0
          - globals@15.11.0

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.6
    hooks:
      - id: prettier
        name: Prettier
        types_or: [javascript, vue, css, json, yaml]
        args: [--write]