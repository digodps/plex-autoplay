<aside class="sidebar">
  <a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-mark">PA</span><span>Plex Autoplay</span></a>
  <nav aria-label="Navegação principal">
    <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}"><span class="nav-icon">▦</span> Visão geral</a>
    <a class="nav-link {% if active_page == 'config' %}active{% endif %}" href="{{ url_for('config_page') }}"><span class="nav-icon">⚙</span> Configuração</a>
    
    {% if plex_libraries %}
    <hr class="nav-divider">
    {% for lib in plex_libraries %}
      {% if lib.type == 'show' %}
        <a class="nav-link {% if active_library == lib.key %}active{% endif %}" 
           href="{{ url_for('library_view', section_key=lib.key) }}">
          <span class="nav-icon">▤</span>
          {{ lib.title }}
        </a>
      {% endif %}
    {% endfor %}
    {% endif %}
  </nav>
  <div class="sidebar-footer">
    <span class="connection-dot"></span>
    <span>Serviço conectado</span>
  </div>
</aside>
