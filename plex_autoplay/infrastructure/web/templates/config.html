<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Configuração · Plex Autoplay</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
  <div class="app-shell">
    {% set active_page = 'config' %}
    {% include 'partials/sidebar.html' %}

    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">CONFIGURAÇÃO DO PLEX</p>
          <h1>Configuração do Plex Autoplay</h1>
        </div>
        <div class="topbar-actions">
          <span class="user-label">{{ session.get("admin", "Administrador") }}</span>
          <form method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="button button-quiet" type="submit">Sair</button>
          </form>
        </div>
      </header>

      <section class="content-section">
        <form method="post" action="{{ url_for('save_config') }}" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="card-grid">

            <!-- Conexão com o Plex -->
            <article class="card">
              <h3><span class="icon">🔗</span> Conexão com o Plex</h3>
              <div class="form-row">
                <label>URL do servidor Plex <span class="required">*</span>
                  <input type="url" name="plex_url" value="{{ raw_config.plex_url }}" required placeholder="http://localhost:32400">
                </label>
              </div>
              <div class="form-row">
                <label>Token do Plex <span class="required">*</span>
                  <input type="password" name="plex_token" value="{{ raw_config.plex_token }}" autocomplete="off" placeholder="Insira seu token do Plex">
                  {% if raw_config.plex_token %}
                  <p class="muted">O token atual está mascarado; deixe em branco para manter.</p>
                  {% endif %}
                </label>
              </div>
            </article>

            <!-- Comportamento do Autoplay -->
            <article class="card">
              <h3><span class="icon">▶️</span> Comportamento do Autoplay</h3>
              <div class="form-row checkbox-row">
                <label><input type="checkbox" name="auto_skip_intro" {% if raw_config.auto_skip_intro %}checked{% endif %}> Pular intro automaticamente</label>
                <label><input type="checkbox" name="auto_next_episode" {% if raw_config.auto_next_episode %}checked{% endif %}> Avançar para próximo episódio automaticamente</label>
              </div>
              <div class="form-row">
                <label>Tempo limite para próximo episódio (segundos)
                  <input type="number" name="next_episode_threshold_seconds" min="1" value="{{ raw_config.next_episode_threshold_seconds }}">
                </label>
                <label>Atraso antes da ação (segundos)
                  <input type="number" name="action_delay_seconds" min="0" value="{{ raw_config.action_delay_seconds }}">
                </label>
              </div>
              <div class="form-row">
                <label>Intervalo de polling (segundos)
                  <input type="number" name="poll_interval_seconds" min="1" value="{{ raw_config.poll_interval_seconds }}">
                </label>
              <div class="form-row">
                <label>Segundos padrão de início de intro a pular
                  <input type="number" name="default_intro_skip_seconds" min="0" value="{{ raw_config.default_intro_skip_seconds }}">
                </label>
              </div>
            </article>

            <!-- Varredura & Webhook -->
            <article class="card">
              <h3><span class="icon">🔄</span> Varredura & Webhook</h3>
              <div class="form-row">
                <label>Intervalo de varredura (minutos)
                  <input type="number" name="scan_interval_minutes" min="1" value="{{ raw_config.scan_interval_minutes }}">
                </label>
                <label>Webhook secret (HMAC)
                  <input type="password" name="webhook_secret" value="{{ raw_config.webhook_secret }}" autocomplete="off" placeholder="Deixe vazio para desativar verificação">
                </label>
              </div>
              <div class="form-row">
                <label>Redis URL
                  <input type="text" name="redis_url" value="{{ raw_config.redis_url }}" placeholder="redis://localhost:6379/0">
                </label>
              </div>
            </article>

          </div>

          <div class="form-actions">
            <button class="button button-primary" type="submit">Salvar configuração</button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <script src="{{ url_for('static', filename='dashboard.js') }}" defer></script>
</body>
</html>
