<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{{ library.title }} · Plex Autoplay</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  <style>
    /* Use full width like dashboard */
    .main-content { max-width: none; padding: 1.5rem; }

    /* Grid for series cards – max 2 per row */
    .card-grid {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: 1fr;               /* mobile */
    }
    @media (min-width: 900px) {
      .card-grid { grid-template-columns: repeat(2, 1fr); }  /* desktop – max 2 per line */
    }

    /* Series card – reuse .card layout */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .series-thumb {
      width: 48px;
      height: 72px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
      background: var(--bg);
    }

    .card-header h3 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
    }

    .card-body {
      flex: 1;
      padding: 0.5rem 1rem 1rem;
      overflow-y: auto;
      max-height: 70vh;
    }

    .episodes-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.9rem;
    }

    .episode-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--border);
    }
    .episode-row:last-child { border-bottom: none; }

    .ep-num {
      font-weight: 600;
      min-width: 2.8rem;
      color: var(--muted);
    }

    .ep-title {
      flex: 1 1 30%;
      min-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
    }

    .marker-inputs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
    }

    .marker-inputs label {
      display: flex;
      flex-direction: column;
      font-size: 0.7rem;
      line-height: 1.1;
      color: var(--muted);
    }

    .marker-inputs input {
      width: 88px;
      padding: 4px 8px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--fg);
    }

    .save-btn {
      margin-left: auto;
      padding: 0.35rem 0.8rem;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .marker-inputs input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-alpha);
    }

    .library-thumb {
      width: 120px;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--bg);
      flex-shrink: 0;
    }

    .library-info h1 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
    }

    .library-meta {
      display: flex;
      gap: 1.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    {% set active_page = 'library' %}
    {% set active_library = library.key %}
    {% include 'partials/sidebar.html' %}

    <main class="main-content" id="library-view">
      <header class="topbar">
        <div>
          <p class="eyebrow">BIBLIOTECA</p>
          <h1>{{ library.title }}</h1>
        </div>
        <div class="topbar-actions">
          <span class="user-label">{{ session.get("admin", "Administrador") }}</span>
          <form method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="button button-quiet" type="submit">Sair</button>
          </form>
        </div>
      </header>

      <section class="content-section">
        <div class="section-heading"><div><p class="eyebrow">SÉRIES</p><h2>Conteúdo da biblioteca</h2></div></div>
        
        <div class="card-grid" id="series-grid">
          <div class="muted" style="grid-column: 1 / -1; text-align:center; padding:2rem;">Carregando séries…</div>
        </div>
      </section>
    </main>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const csrf = document.querySelector('meta[name="csrf-token"]').content;
    const sectionKey = '{{ section_key }}';
    const container = document.getElementById('series-grid');

    async function loadSeries() {
      try {
        const resp = await fetch(`/api/sync/library/${encodeURIComponent(sectionKey)}/tree`, {
          headers: { 'X-CSRF-Token': csrf },
          credentials: 'same-origin'
        });
        const data = await resp.json();
        renderSeries(data.series, container);
      } catch (e) {
        container.innerHTML = `<p class="muted" style="color:var(--red); grid-column:1/-1; text-align:center;">Erro ao carregar: ${e}</p>`;
      }
    }

    // Helper: convert milliseconds to "mm:ss" string
    function msToMinSec(ms) {
      if (ms === undefined || ms === null || ms === '') return '';
      const totalSec = Math.floor(Number(ms) / 1000);
      if (isNaN(totalSec)) return '';
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    // Helper: parse "mm:ss" (or "m:ss") to milliseconds, returns null on failure
    function minSecToMs(str) {
      if (!str) return null;
      const parts = str.split(':');
      if (parts.length !== 2) return null;
      const m = parseInt(parts[0], 10);
      const s = parseInt(parts[1], 10);
      if (isNaN(m) || isNaN(s) || s < 0 || s >= 60) return null;
      return (m * 60 + s) * 1000;
    }

    // Simple mask for mm:ss while typing
    function applyMinSecMask(input) {
      input.addEventListener('input', () => {
        let v = input.value.replace(/[^0-9]/g, '');
        if (v.length > 4) v = v.slice(0,4);
        if (v.length >= 3) {
          v = v.slice(0, v.length-2) + ':' + v.slice(v.length-2);
        }
        input.value = v;
      });
    }

    function renderSeries(series, container) {
      if (!series || series.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <div class="empty-icon">📺</div>
            <h3>Nenhuma série encontrada nesta biblioteca</h3>
            <p>Execute uma varredura para descobrir episódios.</p>
          </div>`;
        return;
      }
      let html = '';
      series.forEach(ser => {
        const poster = ser.seasons[0]?.episodes[0]?.thumb || '';
        html += `
          <article class="card" data-series="${ser.title}">
            <header class="card-header">
              ${poster ? `<img class="series-thumb" src="${poster}" alt="${ser.title}">` : ''}
              <h3 class="series-title">${ser.title}</h3>
            </header>
            <div class="card-body">
              <ul class="episodes-list">`;
        ser.seasons.forEach(season => {
          season.episodes.forEach(ep => {
            const intro = ep.intro || {start_ms:'', end_ms:''};
            const credStart = ep.credits_start !== undefined ? ep.credits_start : '';
            const credEnd = ep.credits_end !== undefined ? ep.credits_end : '';
            html += `
              <li class="episode-row" data-rating="${ep.rating_key}">
                <span class="ep-num">E${String(ep.episode).padStart(2,'0')}</span>
                <span class="ep-title" title="${ep.title}">${ep.title}</span>
                <div class="marker-inputs">
                  <label>Intro ini<input type="text" class="mk-intro-start" value="${msToMinSec(intro.start_ms)}" placeholder="mm:ss" data-ms="${intro.start_ms||''}"></label>
                  <label>Intro fim<input type="text" class="mk-intro-end" value="${msToMinSec(intro.end_ms)}" placeholder="mm:ss" data-ms="${intro.end_ms||''}"></label>
                  <label>Cred ini<input type="text" class="mk-cred-start" value="${msToMinSec(credStart)}" placeholder="mm:ss" data-ms="${credStart||''}"></label>
                  <label>Cred fim<input type="text" class="mk-cred-end" value="${msToMinSec(credEnd)}" placeholder="mm:ss" data-ms="${credEnd||''}"></label>
                  <button class="button button-primary save-btn" data-rating="${ep.rating_key}">Salvar</button>
                </div>
              </li>`;
        });
        });
        html += `</ul></div></article>`;
      });
      container.innerHTML = html;
      // Apply mask to all marker inputs
      container.querySelectorAll('.marker-inputs input[type="text"]').forEach(applyMinSecMask);
      attachSaveListeners(container);
    }

    function attachSaveListeners(container) {
      container.querySelectorAll('.save-btn').forEach(btn => {
        // create a discreet error label below the marker inputs (same style as login page)
        const feedback = document.createElement('p');
        feedback.className = 'field-error';
        feedback.style.marginTop = '0.25rem';
        feedback.style.marginBottom = '0';
        feedback.style.fontSize = '0.8rem';
        feedback.style.color = 'var(--red)';
        feedback.textContent = '';

        // Insert feedback after the .marker-inputs container so it appears on a new line,
        // without moving the Save button.
        const row = btn.closest('.episode-row');
        const markerInputs = row.querySelector('.marker-inputs');
        markerInputs.parentNode.insertBefore(feedback, markerInputs.nextSibling);

        btn.addEventListener('click', async () => {
          const rk = btn.dataset.rating;
          feedback.textContent = '';

          function markInvalid(input) {
            input.style.borderColor = 'var(--red)';
            // remove on next user input
            const clear = () => {
              input.style.borderColor = '';
              input.removeEventListener('input', clear);
            };
            input.addEventListener('input', clear);
          }

          function getMs(selector) {
            const input = row.querySelector(selector);
            const ms = minSecToMs(input.value);
            if (ms === null && input.value !== '') {
              feedback.textContent = `Formato inválido: "${input.value}" (use mm:ss)`;
              markInvalid(input);
              throw new Error('Invalid time format');
            }
            return ms !== null ? ms : 0;
          }

          let introStart, introEnd, credStart, credEnd;
          try {
            introStart = getMs('.mk-intro-start');
            introEnd   = getMs('.mk-intro-end');
            credStart  = getMs('.mk-cred-start');
            credEnd    = getMs('.mk-cred-end');
          } catch (e) {
            return; // feedback already shown
          }

          async function doSave(body) {
            const resp = await fetch('/api/sync/marker', {
              method: 'POST',
              headers: { 'Content-Type':'application/json', 'X-CSRF-Token': csrf },
              credentials: 'same-origin',
              body: JSON.stringify({...body, section_key: sectionKey})
            });
            if (!resp.ok) {
              const j = await resp.json().catch(()=>({}));
              throw new Error(j.error || `HTTP ${resp.status}`);
            }
            return resp.json();
          }

          try {
            await doSave({rating_key:rk, kind:'intro', start_ms:introStart, end_ms:introEnd});
            if (credStart || credEnd) {
              await doSave({rating_key:rk, kind:'credits', start_ms:credStart, end_ms:credEnd});
            }
            btn.textContent = '✔';
            feedback.textContent = '';
            feedback.style.color = 'var(--green)';
            feedback.textContent = 'Salvo';
            setTimeout(()=>{
              btn.textContent = 'Salvar';
              feedback.textContent = '';
              feedback.style.color = 'var(--red)';
            }, 1500);
          } catch (err) {
            feedback.textContent = `Erro: ${err.message}`;
          }
        });
      });
    }

    // initial load
    loadSeries();
  });
  </script>
  <script src="{{ url_for('static', filename='dashboard.js') }}" defer></script>
</body>
</html>
