services:
  plex-autoplay-test:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    image: plex-autoplay:test
    container_name: plex-autoplay-test
    restart: unless-stopped
    env_file: ../.env
    environment:
      WEB_PORT: "8081"
      DISABLE_HTTP: "false"
      MEDIA_ROOTS: ${MEDIA_ROOTS:-/home/hermes/media}
      SQLITE_CONNECTION_STRING: "Data Source=/data/app.db"
      APP_CONFIG_PATH: /data/app-config.json
      LOG_LEVEL: Information
    ports:
      - "8082:8081"
    volumes:
      - ../data-test:/data
      - /home/hermes/media:/home/hermes/media
