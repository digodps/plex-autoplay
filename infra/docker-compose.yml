services:
  plex-autoplay:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    image: ${IMAGE_NAME:-plex-autoplay:latest}
    # No fixed container_name; let compose generate unique names per project
    restart: unless-stopped
    env_file: ../.env
    environment:
      MEDIA_ROOTS: ${MEDIA_ROOTS:-/home/hermes/media}
      SQLITE_CONNECTION_STRING: "Data Source=/data/app.db"
      APP_CONFIG_PATH: /data/app-config.json
      LOG_LEVEL: Information
    ports:
      - "8080:80"
    volumes:
      - ../data:/data
      - /home/hermes/media:/home/hermes/media
      # Monte aqui cada diretório adicional listado em MEDIA_ROOTS.